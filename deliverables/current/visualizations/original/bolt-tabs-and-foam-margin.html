<div id="bolt-foam-explainer">
  <style>
    #bolt-foam-explainer { color: var(--foreground); }
    #bolt-foam-explainer .bf-heading { padding-right: 94px; }
    #bolt-foam-explainer .bf-steps { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
    #bolt-foam-explainer .bf-figure { display: block; width: 100%; overflow: visible; }
    #bolt-foam-explainer .bf-figure text { fill: var(--foreground); font-family: inherit; font-weight: 400; }
    #bolt-foam-explainer .bf-figure .small { font-size: var(--font-size-base); }
    #bolt-foam-explainer .bf-figure .plate { fill: var(--viz-series-1); fill-opacity: .22; stroke: var(--viz-series-1); stroke-width: 1.4; }
    #bolt-foam-explainer .bf-figure .tab { fill: var(--viz-series-1); fill-opacity: .48; stroke: var(--viz-series-1); stroke-width: 1.4; }
    #bolt-foam-explainer .bf-figure .foam { fill: var(--viz-series-2); fill-opacity: .28; stroke: var(--viz-series-2); stroke-width: 1.4; }
    #bolt-foam-explainer .bf-figure .line { fill: none; stroke: var(--foreground); stroke-width: 1.2; }
    #bolt-foam-explainer .bf-figure .ref { fill: none; stroke: var(--muted-foreground); stroke-width: 1; stroke-dasharray: 4 4; }
    #bolt-foam-explainer .bf-figure .conflict { fill: var(--destructive); fill-opacity: .32; stroke: var(--destructive); stroke-width: 1.4; }
    #bolt-foam-explainer .bf-detail { margin: 8px 0 0; }
  </style>
  <h2 class="bf-heading">Bolt tabs and the foam’s backing</h2>
  <div class="bf-steps" role="group" aria-label="Explanation views">
    <button type="button" class="btn" data-bf-view="location" aria-pressed="true">Tab location</button>
    <button type="button" class="btn" data-bf-view="depth" aria-pressed="false">Why it can catch</button>
    <button type="button" class="btn" data-bf-view="centered" aria-pressed="false">Foam centered</button>
    <button type="button" class="btn" data-bf-view="shifted" aria-pressed="false">Foam after a shift</button>
  </div>
  <svg class="bf-figure" role="img" aria-labelledby="bf-svg-title bf-svg-desc"></svg>
  <div class="bf-detail text-small" aria-live="polite"></div>
  <script>
  (() => {
    const root = document.getElementById('bolt-foam-explainer');
    const svg = root.querySelector('.bf-figure');
    const detail = root.querySelector('.bf-detail');
    const buttons = [...root.querySelectorAll('[data-bf-view]')];
    const valid = ['location', 'depth', 'centered', 'shifted'];
    let mode = 'location';
    const data = { rod: 4.826, factoryHole: 5.66, customHole: 7, foamWidth: 6, reserve: 1 };
    const relativePlay = (data.factoryHole - data.rod) / 2 + (data.customHole - data.rod) / 2;
    const label = (x,y,t,anchor='start',cls='') => `<text x="${x}" y="${y}" text-anchor="${anchor}" class="${cls}">${t}</text>`;
    const line = (x1,y1,x2,y2,cls='line') => `<path d="M${x1},${y1}L${x2},${y2}" class="${cls}"/>`;
    const dim = (a,b,y) => line(a,y,b,y)+line(a,y-5,a,y+5)+line(b,y-5,b,y+5);
    function draw() {
      const w = Math.max(280, Math.round(root.getBoundingClientRect().width));
      const narrow = w < 500;
      let h = 420;
      let body = '';
      let title = '';
      let desc = '';
      if (mode === 'location') {
        h = narrow ? 420 : 440;
        title = 'A tab adds material inside the large opening';
        desc = 'Front view of the custom round backing plate with its upright capsule opening. Two hypothetical tabs extend inward to surround the diagonal trim rods. These are rejected study features, not features of the selected FT02 plate.';
        const s = Math.min((w-40)/220, 1.42);
        const cx = w/2, cy = 220;
        const X=x=>cx+x*s, Y=y=>cy-y*s;
        const R=110*s, r=58.175*s, halfStraight=17.375*s;
        const capsule = `M${cx-r},${cy-halfStraight}A${r},${r} 0 0 1 ${cx+r},${cy-halfStraight}L${cx+r},${cy+halfStraight}A${r},${r} 0 0 1 ${cx-r},${cy+halfStraight}Z`;
        const outside = `M${cx-R},${cy}A${R},${R} 0 1 1 ${cx+R},${cy}A${R},${R} 0 1 1 ${cx-R},${cy}Z`;
        body += label(w/2,22,'Front view · hypothetical tabs','middle');
        body += `<path class="plate" fill-rule="evenodd" d="${outside}${capsule}"/>`;
        const a={x:51.165,y:23.75}, b={x:-51.625,y:-23.70};
        const edge=63.5, y=a.y, hw=7.5;
        const aTab=`M${X(edge)},${Y(y+hw)}L${X(a.x)},${Y(y+hw)}A${hw*s},${hw*s} 0 0 0 ${X(a.x)},${Y(y-hw)}L${X(edge)},${Y(y-hw)}Z`;
        const bTab=`M${X(-edge)},${Y(b.y+hw)}L${X(b.x)},${Y(b.y+hw)}A${hw*s},${hw*s} 0 0 1 ${X(b.x)},${Y(b.y-hw)}L${X(-edge)},${Y(b.y-hw)}Z`;
        body += `<path class="tab" d="${aTab}"/><path class="tab" d="${bTab}"/>`;
        body += `<circle cx="${X(a.x)}" cy="${Y(a.y)}" r="${3.5*s}" fill="var(--background)" stroke="var(--foreground)" stroke-width="1"/>`;
        body += `<rect x="${X(b.x)-5*s}" y="${Y(b.y)-3.5*s}" width="${10*s}" height="${7*s}" rx="${3.5*s}" transform="rotate(-24.78 ${X(b.x)} ${Y(b.y)})" fill="var(--background)" stroke="var(--foreground)" stroke-width="1"/>`;
        body += label(cx,cy-12,'Open access','middle')+label(cx,cy+9,'to the controls','middle');
        body += line(X(a.x),Y(a.y)-9*s,X(a.x)+10,53)+label(w/2,47,'Added tongue + bolt hole','middle');
        body += label(cx,h-17,'Selected FT02: these tabs are omitted','middle');
        detail.textContent='Tabs would guide the backing around the two trim rods. They are not handle openings or new wall fasteners.';
      } else if (mode === 'depth') {
        h = narrow ? 435 : 420;
        title='Different depth planes can require different hole positions';
        desc='Schematic side view, with depth increasing toward the shower on the right. An angled rod goes through the factory inner-plate hole but meets the edge of a hypothetical new tab closer to the wall. The angle and offset are illustrative, not measured. The source scan flags possible interference in the tested placement.';
        const x0=30, x1=w*.31, x2=w*.74, x3=w-24;
        const rodY=x=>212+(140-212)*(x-x0)/(x2-x0);
        const gapY=140, gapHalf=17;
        body += label(16,22,'Side view · schematic')+label(16,43,'Depth → out toward the shower');
        body += `<rect x="${x1-7}" y="80" width="14" height="${gapY-gapHalf-80}" class="plate"/><rect x="${x1-7}" y="${gapY+gapHalf}" width="14" height="140" class="plate"/>`;
        body += `<rect x="${x2-7}" y="80" width="14" height="${gapY-gapHalf-80}" fill="var(--muted)" stroke="var(--muted-foreground)" stroke-width="1.3"/><rect x="${x2-7}" y="${gapY+gapHalf}" width="14" height="140" fill="var(--muted)" stroke="var(--muted-foreground)" stroke-width="1.3"/>`;
        body += line(x1-22,gapY,x2+22,gapY,'ref');
        body += `<path d="M${x0},${rodY(x0)}L${x3},${rodY(x3)}" fill="none" stroke="var(--muted-foreground)" stroke-width="10" stroke-linecap="round"/>`;
        body += `<circle cx="${x1}" cy="${rodY(x1)}" r="13" class="conflict"/>`;
        body += label(x1,325,'New flat','middle')+label(x1,345,'tab plane','middle');
        body += label(x2,325,'Factory','middle')+label(x2,345,'hole plane','middle');
        body += line(x1+12,rodY(x1)+5,w-20,246)+label(w-20,268,'Possible contact','end');
        body += label(20,390,'Illustrative angle; not measured');
        detail.textContent='Your loose-plate measurements remain valid. Copying their hole locations to a different depth plane still needs the rod axes to line up.';
      } else {
        const shifted=mode==='shifted';
        h=narrow ? 460 : 430;
        const shift=shifted ? relativePlay : 0;
        const s=(w-40)/14, X=x=>20+(x+4)*s;
        title=shifted ? 'A relative shift can use up the extra foam backing' : 'The full foam width plus a little extra backing';
        desc=shifted ? 'Illustrative straight-edge section. The six millimeter foam band remains fixed to the factory inner plate. A 1.504 millimeter relative backing-plate shift uses the one millimeter nominal extra reserve and leaves about half a millimeter of foam beyond the backing aperture edge. This is a clearance-only scenario, not an observed shift or proof of a leak.' : 'Illustrative straight-edge section. The approximately six millimeter foam band has backing under its full width. The new plate continues inward another one millimeter before its opening begins. The one millimeter dimension is extra supporting surface, not foam width or foam thickness.';
        body += label(16,22,'Local edge · widths to scale');
        body += label(16,44,'Layer spacing schematic');
        body += dim(X(1),X(7),80)+label(X(4),70,'Foam width ≈ 6 mm','middle');
        body += `<rect x="${X(1)}" y="102" width="${6*s}" height="58" class="foam"/>`;
        body += label(X(4),136,'Foam','middle');
        body += `<rect x="${X(shift)}" y="178" width="${(10-shift)*s}" height="38" class="plate"/>`;
        body += label(X(6.8),203,narrow?'Backing':'Custom backing','middle');
        body += label(X(-2.5),192,'Access','middle')+label(X(-2.5),212,'opening','middle');
        body += line(X(1),92,X(1),235,'ref');
        body += line(X(0),94,X(0),260,'ref');
        if(shifted) {
          const over=shift-1;
          body += `<rect x="${X(1)}" y="102" width="${over*s}" height="58" fill="url(#bf-hatch)" stroke="var(--destructive)" stroke-width="1.4"/>`;
          body += dim(X(1),X(shift),245);
          body += line(X((1+shift)/2),250,X(3.5),273)+label(X(3.5),293,'≈ 0.5 mm overhang','middle');
          body += dim(X(0),X(shift),323)+label(16,349,'Relative shift: 1.50 mm');
          detail.textContent='This example exceeds full-width foam support; it does not establish a leak threshold or actual installed movement.';
        } else {
          body += dim(X(0),X(1),245);
          body += line(X(.5),251,X(3.5),273)+label(X(3.5),293,'≈ 1 mm EXTRA backing','middle');
          body += label(16,349,'Relative shift: 0.00 mm');
          detail.textContent='The reserve is nominal and local. The complete foam outline, alignment and contact still need the physical trial.';
        }
        const by=h-43;
        body += label(16,by,'7 mm hole: 1.09 mm one-way room');
        body += label(16,by+22,'Factory hole: 0.42 mm one-way room');
      }
      svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
      svg.style.height=`${h}px`;
      svg.innerHTML=`<title id="bf-svg-title">${title}</title><desc id="bf-svg-desc">${desc}</desc><defs><pattern id="bf-hatch" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 6L6 0" stroke="var(--destructive)" stroke-width="1.5"/></pattern></defs>${body}`;
      buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.bfView===mode)));
    }
    function applySaved(state) {
      const saved=state?.modelContent || state;
      if(saved?.explainer==='bolt-tabs-FT02' && valid.includes(saved.view)) mode=saved.view;
    }
    applySaved(window.openai?.widgetState);
    buttons.forEach(b=>b.addEventListener('click',()=>{
      mode=b.dataset.bfView; draw();
      if(window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{explainer:'bolt-tabs-FT02',view:mode,relative_shift_example_mm:relativePlay},privateContent:null}).catch(()=>{});
    }));
    window.addEventListener('openai:set_globals',event=>{
      const saved=event.detail?.globals?.widgetState;
      if(saved){applySaved(saved);draw();}
    });
    new ResizeObserver(draw).observe(root);
    draw();
  })();
  </script>
</div>
