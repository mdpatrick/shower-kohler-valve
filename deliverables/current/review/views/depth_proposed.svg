t</text><rect x="510.15" y="503" width="72.00000000000011" height="25" rx="2" fill="#78858c"/><text x="594.1500000000001" y="522" font-size="17" fill="#78858c" font-weight="normal">15.7</text><text x="35" y="570" font-size="18" fill="#213c47" font-weight="normal">Cover at stud axis</text><rect x="636.15" y="551" width="27.0" height="25" rx="2" fill="#3d657c"/><text x="675.15" y="570" font-size="17" fill="#3d657c" font-weight="normal">inside 18.7 / front 20.2</text><path d="M636.15,617 L852.1755311468424,617" stroke="#b23028" stroke-width="1.5" fill="none" stroke-dasharray=""/><path d="M636.15,612 L636.15,622" stroke="#b23028" stroke-width="1.5" fill="none" stroke-dasharray=""/><path d="M852.1755311468424,612 L852.1755311468424,622" stroke="#b23028" stroke-width="1.5" fill="none" stroke-dasharray=""/><text x="35" y="623" font-size="17" fill="#a62f25" font-weight="bold">Past cover inside: 12.0 mm</text><path d="M375.15,145 L375.15,665" stroke="#168ca0" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/><text x="35" y="704" font-size="19" fill="#116b7b" font-weight="normal">Cover rim / assumed landing plane: Z 4.175 mm.</text><text x="35" y="735" font-size="18" fill="#213c47" font-weight="normal">No bolt holes in the outer cover. The nuts and stud tips must fit behind its inside surface.</text><text x="35" y="765" font-size="17" fill="#213c47" font-weight="normal">Original guide: stud tips at most 7/16 in (11.1 mm) from the finished wall; actual adjustment unverified.</text><text x="35" y="797" font-size="17" fill="#213c47" font-weight="normal">A backing plate changes the stack. Its thickness alone does not prove sealing, support or engagement.</text></g></svg>